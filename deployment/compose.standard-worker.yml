# Additive qualification deployment. Does not recreate the three existing services.
# Never mount the administrative home, application database, SSH, or all appdata.
services:
  standard-worker:
    image: ${CODEX_STANDARD_IMAGE:?An immutable standard-worker image is required}
    container_name: codex-standard-worker
    profiles: [standard-qualification]
    restart: unless-stopped
    init: true
    user: "11003:11003"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${DEPLOY_ROOT}/config/seccomp-bwrap.json
      - systempaths=unconfined
    volumes:
      - type: bind
        source: ${STANDARD_ROOT:?Dedicated standard storage is required}/workspaces
        target: /workspaces
        bind:
          create_host_path: false
      - type: bind
        source: ${STANDARD_ROOT}/worker-token.txt
        target: /run/secrets/standard_worker_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${STANDARD_ROOT}/projects.json
        target: /etc/standard-worker/projects.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    networks: [standard_execution]
    # No ports, egress proxy, administrative network, or Docker socket.
    pids_limit: 128
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, node, /app/scripts/sandbox/worker-health.cjs]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  standard_execution:
    internal: true
    driver: bridge
