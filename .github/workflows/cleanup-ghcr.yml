name: Clean old GHCR SHA images

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List versions without deleting them
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: mergeron-ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_PACKAGE: mergeron
      KEEP_SHA_VERSIONS: '10'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep the 10 newest SHA-only images
        run: scripts/cleanup-ghcr-sha.sh
