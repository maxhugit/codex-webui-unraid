name: Publier les images Unraid MCP

on:
  push:
    branches: [main]
    paths:
      - 'deployment/unraid-mcp/**'
      - '.github/workflows/unraid-mcp-images.yml'
  workflow_dispatch:

concurrency:
  group: unraid-mcp-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/unraid-mcp
  OAUTH_IMAGE: ghcr.io/${{ github.repository_owner }}/unraid-mcp-oauth

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/${{ github.repository_owner }}/unraid-mcp
            dockerfile: deployment/unraid-mcp/Dockerfile.backend
          - name: oauth
            image: ghcr.io/${{ github.repository_owner }}/unraid-mcp-oauth
            dockerfile: deployment/unraid-mcp/Dockerfile.oauth
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer les étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Construire et publier ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: deployment/unraid-mcp
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=unraid-mcp-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=unraid-mcp-${{ matrix.name }}
          provenance: mode=max
          sbom: true
