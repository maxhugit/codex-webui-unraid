name: Qualifier et publier le moteur standard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sandbox/**'
      - 'Dockerfile.standard-worker'
      - '.github/workflows/standard-worker.yml'
  workflow_dispatch:

concurrency:
  group: standard-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests des frontières et du service fermé
        run: node --test scripts/sandbox/*.test.cjs
      - name: Tests de préparation du stockage (sans privilèges)
        run: python3 -m unittest discover -s scripts/sandbox -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image de qualification (ne valide pas l'isolation en production)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.standard-worker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-standard-worker:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
