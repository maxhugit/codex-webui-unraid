name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: codex-webui-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web install --frozen-lockfile

      - name: Validate repository content
        run: python3 scripts/check-no-chinese.py

      - name: Validate translation catalogs
        run: pnpm --dir web check:i18n

      - name: Lint
        run: |
          pnpm ensure:codex-schema
          pnpm exec eslint "{src,apps,libs}/**/*.ts" "codex_probe/**/*.ts"
          pnpm --dir web lint

      - name: Test backend startup and migrations
        run: >-
          pnpm exec vitest run
          src/app.controller.spec.ts
          src/database/database.service.spec.ts
          src/database/pending-request-migration.spec.ts
          src/http-stack.spec.ts

      - name: Run frontend tests
        run: pnpm --dir web test

      - name: Build backend
        run: pnpm build

      - name: Build frontend
        run: pnpm --dir web build

      - name: Check frontend bundle budgets
        run: pnpm --dir web check:bundle

  image:
    # The publication workflow performs its own image build, scan and smoke
    # test. During a PR, build once and export every reusable layer so that the
    # exact main commit can be assembled quickly after the merge.
    if: >-
      github.event_name != 'workflow_call' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.unraid
          push: false
          load: true
          tags: codex-webui-unraid:quality-${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
            type=gha
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true

      - name: Start the production image and wait for its health check
        run: scripts/smoke-test-image.sh "codex-webui-unraid:quality-${{ github.sha }}"

      - name: Scan production image dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: codex-webui-unraid:quality-${{ github.sha }}
          format: json
          output: trivy-quality-results.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Require no HIGH or CRITICAL Node.js dependencies
        run: |
          jq -e 'any(.Results[]?; .Type == "node-pkg")' trivy-quality-results.json
          jq -r '.Results[]? | select(.Type == "node-pkg") | .Vulnerabilities[]? | [.Severity, .PkgName, .InstalledVersion, .VulnerabilityID, (.FixedVersion // "")] | @tsv' trivy-quality-results.json
          jq -e '[.Results[]? | select(.Type == "node-pkg") | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' trivy-quality-results.json

      - name: Upload image security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-quality-report-${{ github.sha }}
          path: trivy-quality-results.json
          if-no-files-found: warn
          retention-days: 30
