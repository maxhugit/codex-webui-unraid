name: Check for upstream updates

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/LimLLL/codex-webui.git
          git fetch --no-tags upstream main

      - name: Detect updates
        id: updates
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into a review branch
        if: steps.updates.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/upstream-sync
          git merge --no-edit upstream/main
          git push --force-with-lease origin automation/upstream-sync

      - name: Open or update pull request
        if: steps.updates.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view automation/upstream-sync --json url >/dev/null 2>&1 || \
            gh pr create \
              --base main \
              --head automation/upstream-sync \
              --title "Synchronize LimLLL/codex-webui upstream" \
              --body "Automated weekly synchronization with LimLLL/codex-webui. Review conflicts, security changes, and the Unraid image build before merging."
