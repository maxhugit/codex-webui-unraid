name: Proposer une amélioration
description: Proposer une fonction ou une amélioration du déploiement
title: "[Amélioration] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Besoin
      description: Décrire la situation et la difficulté rencontrée.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solution proposée
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Conséquences sur la sécurité et le déploiement
      description: Indiquer les nouveaux volumes, réseaux, secrets ou permissions nécessaires.
