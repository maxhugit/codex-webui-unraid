changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Changements incompatibles
      labels:
        - breaking-change
    - title: Nouveautés
      labels:
        - enhancement
        - feature
    - title: Corrections
      labels:
        - bug
        - fix
    - title: Sécurité
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Autres changements
      labels:
        - '*'
